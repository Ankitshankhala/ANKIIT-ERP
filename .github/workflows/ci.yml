name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Smoke tests with pytest
      working-directory: ./backend
      # Runs against a throwaway SQLite database; no services needed
      run: python -m pytest -q
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 backend/
    - name: Type check with mypy
      run: |
        pip install mypy sqlalchemy-stubs
        mypy backend/
    - name: Security audit with pip-audit
      run: |
        pip install pip-audit
        pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      working-directory: ./frontend
      # Use npm ci for reproducible builds from package-lock.json
      run: npm ci
    - name: Type check with TypeScript
      working-directory: ./frontend
      run: npm run type-check
    - name: Smoke tests with Vitest
      working-directory: ./frontend
      run: npm test
    - name: Build
      working-directory: ./frontend
      run: npm run build
    - name: Lint with ESLint
      working-directory: ./frontend
      # Still fails on existing `no-explicit-any` errors until those are typed
      run: npm run lint --if-present
    - name: Security audit with npm
      working-directory: ./frontend
      run: npm audit
